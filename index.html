<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2aa6b8" />
    <title>Saltwind</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="zone"></div>
    <div id="hint">Touch and drag to sail</div>
    <div id="stick"><div id="knob"></div></div>
    <button id="fireL" class="fire" data-key="Q"><b>FIRE</b><span>LEFT</span></button>
    <button id="fireR" class="fire" data-key="E"><b>FIRE</b><span>RIGHT</span></button>
    <div id="bars"></div>
    <div id="rain"></div>
    <div id="flash"></div>
    <div id="wind"></div>
    <div id="marks"></div>
    <div id="boss"><b>The Kraken</b><div class="bar"><i></i></div><div class="pips"></div></div>
    <div id="bark"></div>
    <div id="ink"><span></span><span></span></div>
    <div id="compass"><i><svg viewBox="0 0 24 24"><path d="M12 3l6 16-6-4-6 4z"/></svg></i><span></span></div>
    <div id="goal"></div>
    <div id="banner"></div>
    <button id="visit" class="go"></button>
    <div id="chart"></div>
    <div id="talk"></div>
    <div id="title"></div>
    <div id="panel"><div class="card"></div></div>
    <div id="hud">
      <div id="hull"><i></i></div>
      <div id="gold"><span class="coin"></span><b>0</b></div>
      <div id="cargo"><svg viewBox="0 0 24 24"><path d="M4 8l8-4 8 4v9l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v9"/></svg><b>0</b></div>
      <div id="gear"></div>
    </div>
    <div id="audio"></div>
    <div id="rotate"><div>Turn your phone sideways<br /><small>Saltwind is played in landscape</small></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
